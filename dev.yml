# Every setting alfred reads, from the shell, by bare name: unset stays unset.
# One list for the api and the renderer; test_stack_settings.py holds it to
# what alfred reads. See docs/configuration.md and docs/build.md#settings.
x-alfred-settings: &alfred-settings
  # Development only; production.yml has no passthrough for it.
  ALFRED_DEV_SKIP_AUTH:
  ALFRED_DEV_USER_EMAIL:
  ALFRED_ALLOW_REGISTRATION:
  ALFRED_SEED_OWNER:
  ALFRED_PUBLIC_URL:
  ALFRED_REMOTE_MEDIA_HOSTS:
  # Also sets OTTO_DOWNLOAD_DIR in each service.
  ALFRED_REMOTE_CACHE_DIR:
  ALFRED_REMOTE_CACHE_TTL:
  ALFRED_RENDER_DIR:
  ALFRED_DELIVERY_DIR:
  ALFRED_PREVIEW_DIR:
  ALFRED_FRAME_TTL:
  ALFRED_PREVIEW_CONCURRENCY:
  ALFRED_PREVIEW_WAIT:
  ALFRED_MEDIA_URL_TTL:
  ALFRED_BUCKET_NAME:
  ALFRED_SMTP_TIMEOUT:
  # joe beside the stack: http://host.docker.internal:8010.
  # See docs/configuration.md#docker-hosts-and-joe.
  ALFRED_AUDIO_ENGINE_URL:
  ALFRED_AUDIO_ENGINE_TIMEOUT:

# One per field of vox's EngineContract, in its order. Compose takes names,
