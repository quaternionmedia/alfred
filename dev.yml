services:
  # TODO Development Reloader description
  website:
    ports:
      # Loopback unless asked otherwise; see the api's ports below.
      - ${ALFRED_BIND:-127.0.0.1}:${ALFRED_HMR_PORT:-8001}:8001
    # `yarn run dev` polls rather than watching; see website/dev-watch.js.
    #
    # @parcel/watcher subscribes to inotify, and inotify events do not cross a
    # Docker Desktop bind mount from a Windows or macOS host. The container
    # sees the edited file -- content and mtime both update -- but is never
    # told it changed, so `parcel watch` sat idle and dist/ went stale
    # silently. Every frontend edit needed a container restart.
    #
    # Parcel's own polling backend is not an option: `--watch-backend
    # brute-force` aborts on startup (SIGABRT), and watchman is not installed.
    # PARCEL_WATCHER_BACKEND looks like the obvious env var and parcel never
    # reads it.
    #
    # The trade is that there is no HMR -- dist/ is current within a second,
    # but the browser will not refresh itself. `yarn run dev:hmr` restores the
    # original behaviour on a Linux host, where the events do arrive.
    command: yarn run dev

  # TODO API description
  api:
    ports:
      # Overridable, because 8000 is not ours by right.
      #
      # Another QM project (apothecary) also defaults to 8000, and when both
      # are up the host port goes to whichever bound first -- so `curl
      # localhost:8000` answered a different application entirely while this
      # container was healthy and serving on its own network. That is not a
      # theoretical clash; it happened here, and it made every measurement
      # taken through that port untrustworthy.
      #
      #   ALFRED_PORT=8100 ./al dev
      #
      # And on loopback unless asked otherwise. Published on every interface,
      # the dev stack answered anything on the network -- and with
      # ALFRED_DEV_SKIP_AUTH=1 it answers every request as a superuser. To try
      # the app from a phone on the same network, opt in for that run:
      #
      #   ALFRED_BIND=0.0.0.0 ./al dev
      - ${ALFRED_BIND:-127.0.0.1}:${ALFRED_PORT:-8000}:80
    volumes:
      - ./alfred/otto:/otto/
      # Mounted into a subdirectory, not over the system font directory.
      #
      # As `/usr/share/fonts/truetype/` this replaced the image's fonts with
      # the host's -- and alfred/otto/fonts is empty, so the container ended
      # up with no fonts at all. fontconfig reported 0, ImageMagick reported
      # 0, and every text template silently returned None: `title`, `textBox`,
      # `bullets`, `initial` and `final` are all TextClip, so five of the six
      # templates could not render. generateEdl turned that into "A clip did
      # not get made properly", which names neither fonts nor ImageMagick.
      #
      # A subdirectory is additive: project fonts appear alongside the image's
      # eight rather than instead of them. Same shape as the node_modules
      # mount in docker-compose.yml -- a bind mount over a populated path
      # takes the host's version of it, empty or not.
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
    environment:
      # Passed through from the host, empty unless you ask for it:
      #   ALFRED_DEV_SKIP_AUTH=1 ./al dev
      # Serves every request as a fixed superuser and skips the login screen.
      # config.py refuses to start if this is combined with ALFRED_PRODUCTION.
      # Only in dev.yml -- production.yml has no such passthrough, so there is
      # no environment variable a production stack will even look at.
      - ALFRED_DEV_SKIP_AUTH=${ALFRED_DEV_SKIP_AUTH:-}
      # The same absolute path the renderer writes to, so delivery reads the
      # file the worker actually produced rather than guessing from its own
      # working directory.
      - VIDEO_DIR=/app/videos
      # Same passthrough as the renderer's: hosts a clip may name remote media
      # on, empty unless you ask for it.
      - ALFRED_REMOTE_MEDIA_HOSTS=${ALFRED_REMOTE_MEDIA_HOSTS:-}

  renderer:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: alfred_worker
    # No `--workdir`: the image's own WORKDIR, /app, is the right one. The
    # worker was started in /app/alfred only so that a stale `core.utils.tasks`
    # entry in the Celery app's `include` would import -- and from there every
    # library clip (`videos/x.mp4`) resolved to /app/alfred/videos, which does
    # not exist, so no render with a media clip could succeed. The include is
    # fixed and the worker resolves media against VIDEO_DIR itself now, so the
    # working directory no longer decides what a clip name means.
    entrypoint: celery -A alfred.core.utils.tasks:renderer -b mongodb://db:27017/celery --result-backend mongodb://db:27017/celery worker --loglevel=info
    networks:
      - alfred_isolated
    volumes:
      - ./alfred/:/app/alfred/
      # The renderer writes finished videos here, and had nowhere to write
      # them: the api mounts ./videos and the renderer did not, so every render
      # died with "Error opening output videos/....mp4: No such file or
      # directory" -- reported into the database as a failed render and
      # nowhere else. The render pipeline could not produce a file at all in
      # this configuration.
      - ./videos/:/app/videos/
      # Mounted into a subdirectory, not over the system font directory.
      #
      # As `/usr/share/fonts/truetype/` this replaced the image's fonts with
      # the host's -- and alfred/otto/fonts is empty, so the container ended
      # up with no fonts at all. fontconfig reported 0, ImageMagick reported
      # 0, and every text template silently returned None: `title`, `textBox`,
      # `bullets`, `initial` and `final` are all TextClip, so five of the six
      # templates could not render. generateEdl turned that into "A clip did
      # not get made properly", which names neither fonts nor ImageMagick.
      #
      # A subdirectory is additive: project fonts appear alongside the image's
      # eight rather than instead of them. Same shape as the node_modules
      # mount in docker-compose.yml -- a bind mount over a populated path
      # takes the host's version of it, empty or not.
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
      - ./cred.json:/cred.json
    depends_on:
      - 'db'
    environment:
      - CELERY_BROKER=mongodb://db:27017/celery
      - CELERY_BACKEND=mongodb
      - DB_URL=mongodb://db:27017
      - DB_NAME=alfred
      - GOOGLE_APPLICATION_CREDENTIALS=/cred.json
      # Absolute, because a relative path here depends on a working directory
      # nobody sets deliberately. Celery was started with `--workdir
      # /app/alfred`, so a bare `videos/` resolved to /app/alfred/videos --
      # which does not exist -- while the mount is at /app/videos. Every render
      # died on "Error opening output videos/....mp4: No such file or
      # directory", recorded as a failed render and nowhere else.
      - VIDEO_DIR=/app/videos
      # Hosts a clip may name remote media on; empty unless you ask for it:
      #   ALFRED_REMOTE_MEDIA_HOSTS=storage.googleapis.com ./al dev
      # The worker refuses any other URL rather than downloading it. The api
      # reads the same setting and refuses first.
      - ALFRED_REMOTE_MEDIA_HOSTS=${ALFRED_REMOTE_MEDIA_HOSTS:-}

  db:
    ports:
      # 27017 is the most contended port in this stack: a standalone mongod or
      # any other project's database takes it, and the failure names the port
      # without naming the culprit. Nothing in the app needs it published --
      # it is here for attaching a GUI.
      #
      # Loopback, and not through ALFRED_BIND: that is for reaching the app
      # from a phone, which never needs an unauthenticated database on the
      # network as well. ALFRED_DB_BIND moves it, for someone who means to.
      - ${ALFRED_DB_BIND:-127.0.0.1}:${ALFRED_DB_PORT:-27017}:27017
    user: '${UID}:${GID}'
