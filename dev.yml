services:
  # The site, rebuilt into website/dist as it changes.
  website:
    ports:
      - ${ALFRED_BIND:-127.0.0.1}:${ALFRED_HMR_PORT:-8001}:8001
    # Polls: inotify does not cross the bind mount. No HMR; `yarn run dev:hmr`
    # on a Linux host. See docs/build.md#the-sites-watcher.
    command: yarn run dev

  api:
    ports:
      # Loopback unless ALFRED_BIND says otherwise. See docs/dev-server.md.
      - ${ALFRED_BIND:-127.0.0.1}:${ALFRED_PORT:-8000}:80
    volumes:
      - ./alfred/otto:/otto/
      # A subdirectory: over the font directory, it hides the image's fonts.
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
    # Over docker-compose.yml's empty stub; ./al makes it.
    env_file:
      - path: .secret_key.local
        required: false
    # No ALFRED_SECRET_KEY here: a bare name would erase the env files' key.
    environment:
      <<: [*alfred-settings, *audio-engine-contract]
      # Absolute, and the renderer's: delivery reads the file it wrote.
      VIDEO_DIR: /app/videos
      # Hidden in the shared library; never listed or served (contract M6).
      OTTO_DOWNLOAD_DIR: ${ALFRED_REMOTE_CACHE_DIR:-/app/videos/.remote-cache}
    # Docker Desktop has this name; a Linux host needs it added.
    extra_hosts:
      - host.docker.internal:host-gateway

  renderer:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_worker
    # No --workdir: clips resolve against VIDEO_DIR, not the working directory.
    entrypoint: celery -A alfred.core.utils.tasks:renderer -b mongodb://db:27017/celery --result-backend mongodb://db:27017/celery worker --loglevel=info
    networks:
      - alfred_isolated
    volumes:
      - ./alfred/:/app/alfred/
      # Where renders are written; the api reads the same directory.
      - ./videos/:/app/videos/
      # A subdirectory; see the api.
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
      - ./cred.json:/cred.json
    depends_on:
      - 'db'
    # The worker sends issue reports and invoices.
    env_file:
      - .email
    environment:
      <<: [*alfred-settings, *audio-engine-contract]
      CELERY_BROKER: mongodb://db:27017/celery
      CELERY_BACKEND: mongodb
      DB_URL: mongodb://db:27017
      DB_NAME: alfred
      GOOGLE_APPLICATION_CREDENTIALS: /cred.json
      # Absolute, as the api's.
      VIDEO_DIR: /app/videos
      # The api's, so one download serves both.
      OTTO_DOWNLOAD_DIR: ${ALFRED_REMOTE_CACHE_DIR:-/app/videos/.remote-cache}
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    ports:
      # For a GUI only. Not moved by ALFRED_BIND; see docs/dev-server.md.
      - ${ALFRED_DB_BIND:-127.0.0.1}:${ALFRED_DB_PORT:-27017}:27017
    user: '${UID}:${GID}'
