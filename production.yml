networks:
  web:
    name: web
    external: true

services:
  api:
    networks:
      - web
    labels:
      - traefik.http.services.alfred.loadbalancer.server.port=80
      - traefik.http.routers.alfred.rule=Host(`alfred.quaternion.media`)
      - traefik.http.routers.alfred.tls=true
      - traefik.http.routers.alfred.tls.certresolver=le
      - traefik.http.routers.alfred.entrypoints=websecure
      - traefik.docker.network=web
    # No --reload: any write under the checkout would restart the server.
    command:
      ['uvicorn', 'alfred.main:app', '--host', '0.0.0.0', '--port', '80']
    volumes:
      # The renderer's fonts, so a preview draws as the render will.
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
    environment:
      <<: [*alfred-settings, *audio-engine-contract]
      # From the deploying shell only; overrides the committed stub.
      ALFRED_SECRET_KEY: ${ALFRED_SECRET_KEY:?production signs tokens with its own key; export ALFRED_SECRET_KEY before ./al prod}
      # Absolute, and the renderer's.
      VIDEO_DIR: /app/videos
      # Hidden in the shared library; never listed or served (contract M6).
      OTTO_DOWNLOAD_DIR: ${ALFRED_REMOTE_CACHE_DIR:-/app/videos/.remote-cache}
    # An audio engine beside the stack. See docs/configuration.md#docker-hosts-and-joe.
    extra_hosts:
      - host.docker.internal:host-gateway

  # No database ports: an unauthenticated MongoDB stays off the network.
  # A GUI goes through `docker compose exec db mongo`, or a tunnel.

  # dev.yml's renderer, with ALFRED_PRODUCTION.
  renderer:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_worker
    entrypoint: celery -A alfred.core.utils.tasks:renderer -b mongodb://db:27017/celery --result-backend mongodb://db:27017/celery worker --loglevel=info
    networks:
      - alfred_isolated
    volumes:
      - ./alfred/:/app/alfred/
      # Where renders are written; the api reads the same directory.
      - ./videos/:/app/videos/
      - ./alfred/otto/fonts:/usr/share/fonts/truetype/otto
      - ./cred.json:/cred.json
    depends_on:
      - db
    # The worker sends issue reports and invoices.
    env_file:
      - .email
    environment:
      <<: [*alfred-settings, *audio-engine-contract]
      CELERY_BROKER: mongodb://db:27017/celery
      CELERY_BACKEND: mongodb://db:27017/celery
      DB_URL: mongodb://db:27017
      DB_NAME: alfred
      GOOGLE_APPLICATION_CREDENTIALS: /cred.json
      VIDEO_DIR: /app/videos
      OTTO_DOWNLOAD_DIR: ${ALFRED_REMOTE_CACHE_DIR:-/app/videos/.remote-cache}
    # The worker transcribes.
    extra_hosts:
      - host.docker.internal:host-gateway
