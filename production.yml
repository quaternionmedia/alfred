# Over docker-compose.yml, behind a running traefik on the external `web`
# network. `./al prod` builds the docs, then starts it. See docs/build.md.

# As dev.yml's list, minus ALFRED_DEV_SKIP_AUTH (no bypass here) and
# ALFRED_SECRET_KEY (the api's own, below).
x-alfred-settings: &alfred-settings
  # Production is this file's, not the shell's.
  ALFRED_PRODUCTION: 'true'
  ALFRED_ALLOW_REGISTRATION:
  # Reserved in every mode.
  ALFRED_DEV_USER_EMAIL:
  ALFRED_SEED_OWNER:
  # Account mail's links; the host traefik serves unless exported.
  ALFRED_PUBLIC_URL: ${ALFRED_PUBLIC_URL:-https://alfred.quaternion.media}
  ALFRED_REMOTE_MEDIA_HOSTS:
  # Also sets OTTO_DOWNLOAD_DIR in each service.
  ALFRED_REMOTE_CACHE_DIR:
  ALFRED_REMOTE_CACHE_TTL:
  ALFRED_RENDER_DIR:
  ALFRED_DELIVERY_DIR:
  ALFRED_PREVIEW_DIR:
  ALFRED_FRAME_TTL:
  ALFRED_PREVIEW_CONCURRENCY:
  ALFRED_PREVIEW_WAIT:
  ALFRED_MEDIA_URL_TTL:
  ALFRED_BUCKET_NAME:
  ALFRED_SMTP_TIMEOUT:
  ALFRED_AUDIO_ENGINE_URL:
  ALFRED_AUDIO_ENGINE_TIMEOUT:

# One per field of vox's EngineContract; see dev.yml.
