# The production stack, composed over docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f production.yml up --build -d
#
# (`./al prod` runs that, after building the docs.) traefik terminates TLS on
# the external `web` network and is expected to be running already.

# Every setting alfred reads, passed through from the deploying shell as
# dev.yml passes them: export one before `./al prod` and the api and the
# renderer both get it. Exported and not listed here, a setting did nothing
# -- ALFRED_ALLOW_REGISTRATION, the only way to open registration on this
# stack, among them. docs/configuration.md says what each one does.
#
# Bare names, so a setting nobody exported stays unset and the code's own
# default holds; see dev.yml for why that is not the same as empty. One list,
# merged into both services; tests/unit/test_stack_settings.py fails when
# alfred reads a setting this does not pass.
#
# Two settings are not here on purpose. ALFRED_DEV_SKIP_AUTH: the auth bypass
# has no way into this stack. ALFRED_SECRET_KEY: the api below requires it,
# and the renderer signs nothing.
x-alfred-settings: &alfred-settings
  # Production is a property of this file, not of the shell that runs it.
  ALFRED_PRODUCTION: 'true'
  # Closed under ALFRED_PRODUCTION unless this says otherwise:
  #   ALFRED_ALLOW_REGISTRATION=1 ./al prod
  ALFRED_ALLOW_REGISTRATION:
  # Reserved in every mode -- it cannot register, log in or be reset -- so
  # it matters here too, though nothing here acts as it.
  ALFRED_DEV_USER_EMAIL:
  ALFRED_SEED_OWNER:
  # The address account mail links to (password reset, confirmation) --
  # never taken from a request's Host header, which the requester controls.
  # The default is the host the traefik rule below serves; export
  # ALFRED_PUBLIC_URL to deploy elsewhere. Reset mail also needs EMAIL_SERVER
  # and EMAIL_USERNAME, which the `.email` env file carries.
  ALFRED_PUBLIC_URL: ${ALFRED_PUBLIC_URL:-https://alfred.quaternion.media}
  # Hosts a clip may name remote media on; none unless set.
  ALFRED_REMOTE_MEDIA_HOSTS:
  # Also sets OTTO_DOWNLOAD_DIR, the engine's name for it, in each service.
  ALFRED_REMOTE_CACHE_DIR:
  ALFRED_REMOTE_CACHE_TTL:
  ALFRED_RENDER_DIR:
  ALFRED_DELIVERY_DIR:
  ALFRED_PREVIEW_DIR:
  ALFRED_FRAME_TTL:
  ALFRED_MEDIA_URL_TTL:
  ALFRED_BUCKET_NAME:
  # The audio engine captions are transcribed with; none unless set.
  ALFRED_AUDIO_ENGINE_URL:
  ALFRED_AUDIO_ENGINE_TIMEOUT:

# An audio engine's own spelling, one ALFRED_AUDIO_ENGINE_CONTRACT_<FIELD> per
# field of vox's EngineContract; see dev.yml.
