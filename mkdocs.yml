site_name: Alfred
site_description: automatic video editing
site_url: https://alfred.quaternion.media/docs/
# repo_url: https://github.com/quaternionmedia/alfred
edit_uri: ''

# In the order a newcomer reads: what Alfred is, running it, using it, then
# developing it and the reference material, with the history last.
nav:
  - Home: index.md
  - Get started: start.md
  - Cookbook: cookbook.md
  - Captions: captions.md
  - Configuration: configuration.md
  - Develop:
      - Family dev loop: family.md
      - dev-auth.md
      - ownership.md
  - Concepts:
      - about/index.md
      - about/concepts.md
      - about/clip.md
      - about/template.md
      - about/edl.md
      - about/project.md
      - about/render.md
  - Examples:
      - examples/index.md
      - examples/login.md
      - examples/media.md
      - examples/preview.md
      - examples/render.md
      - examples/trim.md
      - examples/combine.md
      - examples/adjust.md
      - examples/fade.md
      - examples/text.md
      - examples/animation.md
      - examples/project.md
  - API:
      - api/index.md
      - api/auth.md
      - api/otto.md
      - api/render.md
      - api/errors.md
  - History:
      - Retrospective (0.3.0): retrospective-0.3.0.md
      - Retrospective (verification): retrospective-verification-discipline.md

# Every check mkdocs can make of the pages, as a warning: a page left out of
# the nav, a link naming no page or file, an anchor no heading makes, and an
# absolute link, which names the site's root and so misses the versioned
# directory mike deploys under. These print on every build, `./al docs`
# included. CI makes a warning fatal (`mkdocs build --strict`, in
# .github/workflows/docs.yml) rather than this file's `strict`: `./al prod`
# builds the docs before it starts the stack, and a broken link should not
# keep production down.
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

# Nothing loaded from another host (P1; the open-license record's rule for
# frontend assets). Material's default fonts come from Google Fonts on every
# page view, so the theme uses the reader's system fonts; and there is no
# emoji extension, whose emoji are images from a CDN -- an icon or emoji in
# the prose is written as the character itself.
theme:
  name: material
  font: false
  logo: assets/al-white.png
  favicon: assets/al-white.png
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/quaternionmedia/alfred
    - icon: material/web
      link: https://alfred.quaternion.media
  version:
    provider: mike
