site_name: Alfred
site_description: automatic video editing
site_url: https://alfred.quaternion.media/docs/
# repo_url: https://github.com/quaternionmedia/alfred
edit_uri: ''

# Six sections, as qm's own site: the journeys a person takes, the reference
# they look things up in, then developing alfred and the API. History links
# out: the dated account is alfred's subtree on qm's site.
nav:
  - Home: index.md
  - Journeys:
      - Get started: start.md
      - User journeys: journeys.md
      - Make a video: guide.md
  - Reference:
      - Captions: captions.md
      - Editing by text: editing-by-text.md
      - Editing tools: tools.md
      - Configuration: configuration.md
  - Develop:
      - Questions a new developer asks: develop.md
      - Commands: commands.md
      - dev-server.md
      - Test loop: loop.md
      - Family dev loop: family.md
      - Browser suite: cookbook.md
      - dev-auth.md
      - ownership.md
      - dependencies.md
      - Images and stacks: build.md
  - API:
      - api/index.md
      - Concepts:
          - about/index.md
          - about/concepts.md
          - about/template.md
          - about/project.md
          - about/render.md
      - Examples:
          - examples/index.md
          - examples/login.md
          - examples/media.md
          - examples/preview.md
          - examples/render.md
          - examples/trim.md
          - examples/combine.md
          - examples/adjust.md
          - examples/fade.md
          - examples/text.md
          - examples/animation.md
          - examples/project.md
      - Routes:
          - api/auth.md
          - api/otto.md
          - api/fonts.md
          - api/render.md
          - api/errors.md
  - History: https://quaternionmedia.github.io/qm/projects/alfred/timeline/

# Every check mkdocs can make of the pages, as a warning: a page left out of
# the nav, a link naming no page or file, an anchor no heading makes, and an
# absolute link, which names the site's root and so misses the versioned
# directory mike deploys under. These print on every build, `./al docs`
# included. CI makes a warning fatal (`mkdocs build --strict`, in
# .github/workflows/docs.yml) rather than this file's `strict`: `./al prod`
# builds the docs before it starts the stack, and a broken link should not
# keep production down.
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# A page plays a walkthrough's recording at its `<!-- recipe: ... -->` marker
# where `./al recipes` left one in docs/recipes/, which git ignores: so only
# docs served locally do.
hooks:
  - scripts/docs_recordings.py

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  # An include that names no file fails the build rather than vanishing:
  # dev-server.md takes its whole list from AGENTS.md.
  - pymdownx.snippets:
      check_paths: true
  - def_list
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

# Nothing loaded from another host (P1; the open-license record's rule for
# frontend assets). Material's default fonts come from Google Fonts on every
# page view, so the theme uses the reader's system fonts; and there is no
# emoji extension, whose emoji are images from a CDN -- an icon or emoji in
# the prose is written as the character itself.
theme:
  name: material
  font: false
  logo: assets/al-white.png
  favicon: assets/al-white.png
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/quaternionmedia/alfred
    - icon: material/web
      link: https://alfred.quaternion.media
  version:
    provider: mike
