networks:
  alfred_isolated:

services:
  flower:
    build: ./flower/
    networks:
      - alfred_isolated
    ports:
      # Loopback: no login, and its API revokes tasks and stops workers.
      - ${ALFRED_BIND:-127.0.0.1}:5555:5555
    command: celery --broker=mongodb://db:27017/celery flower --port=5555
