# Why each pin, override and lockfile: docs/dependencies.md.
[project]
name = "al"
dynamic = ["version"]
description = "The automated video engine"
authors = [{ name = "Quaternion Media", email = "alfred@quaternion.media" }]
dependencies = [
    "al-otto >= 0.2.2",
    "fastapi<1.0.0,>=0.100.0",
    # alfred's own models are pydantic 2's; the floor is otto's. `email` brings
    # the email-validator 2 that EmailStr needs, which fastapi-users does not.
    "pydantic[email]>=2.5,<3",
    "aiofiles<24.0.0,>=23.1.0",
    # Read alfred/core/utils/passwords.py first: the api refuses any release but 15.0.5.
    "fastapi-users>=15.0.5,<16",
    # Parses every form the api takes, login included. Keep it on a release with no open advisory.
    "python-multipart>=0.0.31",
    "motor<4.0.0,>=3.1.1",
    "beanie<2.0.0,>=1.17.0",
    "celery<6.0.0,>=5.3.1",
    "google-cloud-storage<3.0.0,>=2.7.0",
    "pdfrw<1.0,>=0.4",
    "reportlab<4.0.0,>=3.6.12",
    # 5 needs beanie 2.
    "fastapi-users-db-beanie>=4.0.0,<5",
    "fastapi-crudrouter @ git+https://github.com/quaternionmedia/fastapi-crudrouter.git@motor-reupdate",
    "ujson>=5.7.0",
    # Below 13 until tests/pipeline/test_resize.py has run on it.
    "pillow>=12.3,<13",
    # Not imported here; bounds moviepy's and otto's. Below 2 until encoding is tested on 2.x.
    "numpy>=1.26.4,<2",
    # vox's one core dependency; vox installs with --no-deps. Floor is vox's.
    "httpx>=0.27.0,<1",
]
# 3.11 only: what the image, CI, ruff and black run.
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
homepage = "https://github.com/quaternionmedia/alfred"
repository = "https://github.com/quaternionmedia/alfred"
documentation = "https://quaternionmedia.github.io/alfred/"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.dev-dependencies]
dev = ["uvicorn >= 0.20.0", "ruff~=0.0", "black"]
# Same ranges as .github/workflows/docs.yml. Locked in pdm.docs.lock, not pdm.lock.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7,<10"]

[project.optional-dependencies]
test = [
    "pytest >= 7.2.2",
    "pytest-cov >= 4.0.0",
    "pytest-sugar >= 0.9.6",
    "pytest-xdist >= 3.2.1",
    "pytest-timeout>=2.1.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]
# otto's own render extra, by reference. Raise with al-otto's floor above.
render = [
    "al-otto[render]>=0.2.2",
]

# pdm only; pip has no overrides, so every install uses --no-deps. Relock with pdm >= 2.29.
[tool.pdm.resolution.overrides]
# Over fastapi-users' floor. 0.0.31 is the first release with no open advisory.
python-multipart = ">=0.0.31"
# Lock the engine every install runs: the submodule, not PyPI.
al-otto = "file:///${PROJECT_ROOT}/alfred/otto"

[tool.pdm]
version = { source = "file", path = "alfred/_version.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: requires a working ffmpeg binary; actually encodes video",
    "needs_db: requires a running MongoDB",
    "needs_docker: requires a working Docker daemon; builds or runs containers",
    "needs_imagemagick: requires ImageMagick able to render text with a findable font",
]
# An xfail pins a defect: when the defect is fixed, the test fails, and the marker comes off.
xfail_strict = true

[tool.black]
skip-string-normalization = true
# Pinned, or black infers one and warns.
target-version = ['py311']
# force-exclude also covers paths named on the command line.
force-exclude = '(alfred/otto|alfred/vox|governance|website|tests/\.nox)'

[tool.ruff]
target-version = 'py311'
extend-exclude = ['alfred/otto', 'alfred/vox', 'governance', 'website', 'tests/.nox']

[tool.ruff.lint]
# Defaults, plus import order and bugbear. Layout is black's.
select = ['E4', 'E7', 'E9', 'F', 'I', 'B']

[tool.ruff.lint.per-file-ignores]
# Sets the environment before the app's imports read it.
'tests/conftest.py' = ['E402']

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency defaults are meant to be evaluated once.
extend-immutable-calls = [
    'fastapi.Depends',
    'fastapi.Query',
    'fastapi.Path',
    'fastapi.Body',
    'fastapi.File',
    'fastapi.Form',
    'fastapi.Header',
    'fastapi.Cookie',
]
