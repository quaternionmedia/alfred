[project]
name = "al"
dynamic = ["version"]
description = "The automated video engine"
authors = [{ name = "Quaternion Media", email = "alfred@quaternion.media" }]
dependencies = [
    "al-otto >= 0.2.2",
    "fastapi<1.0.0,>=0.92.0",
    "aiofiles<24.0.0,>=23.1.0",
    "fastapi-users<11.0.0,>=10.4.0",
    # Declared although nothing here imports it: it parses every form the api
    # accepts, the login form anyone can post included, so this project
    # depends on its fixes. fastapi-users pins it exactly; see the override.
    "python-multipart>=0.0.31",
    "motor<4.0.0,>=3.1.1",
    "beanie<2.0.0,>=1.17.0",
    "passlib<2.0.0,>=1.7.4",
    "bcrypt<5.0.0,>=4.0.1",
    "celery<6.0.0,>=5.3.1",
    "google-cloud-storage<3.0.0,>=2.7.0",
    "pdfrw<1.0,>=0.4",
    "reportlab<4.0.0,>=3.6.12",
    "fastapi-users-db-beanie<2.0.0,>=1.1.4",
    "fastapi-crudrouter @ git+https://github.com/quaternionmedia/fastapi-crudrouter.git@motor-reupdate",
    "ujson>=5.7.0",
    # 9.5 was pinned because Pillow 10 removed Image.ANTIALIAS, which moviepy
    # 1.0.3 resizes with -- and 9.5 has every advisory since against it,
    # CVE-2023-4863 and CVE-2024-28219 among them. The engine now restores the
    # name when Pillow lacks it (alfred/otto/otto/__init__.py), and
    # tests/pipeline/test_resize.py draws and encodes through that path. 12.3
    # has no advisory open. Below 13, two days old as this is written, until
    # it has had the same test.
    "pillow>=12.3,<13",
    # A constraint more than a dependency: nothing here imports numpy, but
    # moviepy and the engine do, and neither bounds it. The lock held 1.24, the
    # newest numpy that still installed on Python 3.8; 1.26 is the last 1.x.
    # Below 2, which removed APIs, until the encode path (moviepy 1.0.3) has
    # been run on 2.x in the image.
    "numpy>=1.26.4,<2",
    # Capped, not merely floored, and the cap is the load-bearing half.
    #
    # `passlib.pwd` imports `pkg_resources` at module scope, and setuptools
    # removed `pkg_resources` in 81. So on a clean install every module that
    # touches authentication raises ImportError -- which presented as ten
    # unrelated test modules failing to collect, naming neither passlib nor
    # setuptools.
    #
    # This buys time; it does not fix anything. passlib's last release was
    # 2020 and it is not coming back. The exit is fastapi-users >= 13, which
    # replaced passlib with pwdlib -- a dependency bump with an auth migration
    # attached, which is its own change and not this one.
    "setuptools>=75.3.4,<81",
    # The sound engine's client. vox -- vendored at alfred/vox, as otto is at
    # alfred/otto -- is installed with --no-deps like everything else here, so
    # what its core imports has to be declared by this project, and httpx is
    # the whole of that: the rest of vox's own dependencies (a speech
    # synthesizer, a CLI) serve parts of it alfred does not load. The floor is
    # vox's.
    "httpx>=0.27.0,<1",
]
# 3.11, and only 3.11: the image, CI, ruff and black all target it, and the
# engine caps below 3.12 (alfred/otto/pyproject.toml: the newest Python every
# pydantic 1.10 it admits supports). The floor was 3.8.1, and pdm locks for the
# whole range, so anything that has since dropped 3.8 sat at its last release
# that still installed there -- numpy 1.24, anyio 4.5 -- whatever Python ran.
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
homepage = "https://github.com/quaternionmedia/alfred"
repository = "https://github.com/quaternionmedia/alfred"
documentation = "https://quaternionmedia.github.io/alfred/"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.dev-dependencies]
dev = ["uvicorn >= 0.20.0", "ruff~=0.0", "black"]

[project.optional-dependencies]
test = [
    "pytest >= 7.2.2",
    "pytest-cov >= 4.0.0",
    "pytest-sugar >= 0.9.6",
    "pytest-xdist >= 3.2.1",
    "pytest-timeout>=2.1.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    # See the cap on setuptools in the runtime dependencies above; the test
    # environment installs its own copy and needs the same bound.
    "setuptools>=75.3.4,<81",
]
# What the engine's own `render` extra asks for, restated so pdm can lock it.
#
# This was `al-otto[render]>=0.2.2`, and pdm resolves al-otto from PyPI, where
# 0.2.2's render extra still names bezier. The engine alfred runs is the
# submodule at alfred/otto, which dropped bezier after 0.2.2 (otto 0e30bb4),
# so the lock carried a package nothing here imports -- and one with no wheel
# for this Python, which fails to build without the switches otto removed.
# The image, nox and CI install requirements-render.lock, exported from this
# group, and tests/unit/test_stack_config.py fails if it stops matching
# alfred/otto/pyproject.toml.
render = [
    "gizeh~=0.1",
]

# An override replaces every requirement on a package, its dependents'
# included. pdm honours it; pip has no such thing, so the image, nox and CI
# install the exported lockfiles with --no-deps (the Dockerfile says more).
#
# Relock with pdm 2.29 or later. pdm 2.22, with this override locked, fails
# `pdm add`, `pdm update <pkg>` and `pdm lock --update-reuse` with
# CandidateNotFound for python-multipart, and its full `pdm lock` had not
# finished after 49 minutes; only `pdm update python-multipart` worked. 2.29
# relocks everything in under two minutes.
[tool.pdm.resolution.overrides]
# fastapi-users 10.4 pins python-multipart==0.0.6, which has nine advisories
# against it (CVE-2024-24762 and CVE-2024-53981 among them). Every
# fastapi-users before 15.0.4 pins an exact version with some still open --
# 14.x pins 0.0.20, with seven -- and 15 needs pydantic 2, which the engine
# cannot take yet. 0.0.31 is the first release with none open. fastapi-users
# never imports it; FastAPI and Starlette do, and both take this release.
python-multipart = ">=0.0.31"

[tool.pdm]
version = { source = "file", path = "alfred/_version.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: requires a working ffmpeg binary; actually encodes video",
    "needs_db: requires a running MongoDB",
    "needs_docker: requires a working Docker daemon; builds or runs containers",
    "needs_imagemagick: requires ImageMagick able to render text with a findable font",
]
# xfail(strict=True) is used to pin defects: the marked test fails if it ever
# passes, so fixing the defect turns the suite red and prompts removing the
# marker. Make that the default so a non-strict xfail has to be deliberate.
xfail_strict = true

[tool.black]
skip-string-normalization = true
# Pinned, or black infers a target from the syntax it sees and then warns that
# the running interpreter cannot verify its own output.
target-version = ['py311']
# `force-exclude`, not `exclude`: plain `exclude` is ignored for paths given
# explicitly on the command line, and these are submodules with their own
# repositories and their own formatting gates.
force-exclude = '(alfred/otto|alfred/vox|governance|website|tests/\.nox)'

[tool.ruff]
# Explicit, because the absence of this block was not "ruff defaults" -- the
# lint session resolved to a very wide implicit rule set and reported 157
# findings across app and tests, most of them stylistic (62 asked for
# `from __future__ import annotations` in a project that requires 3.11). A
# gate nobody can act on is one everybody learns to ignore, and this one was
# additionally failing on a usage error, so its output was never read at all.
#
# This set is the ruff defaults plus import sorting and bugbear: rules that
# catch mistakes rather than express preferences. Formatting belongs to Black
# (`-S`), which runs in its own session and is the authority on layout.
target-version = 'py311'
extend-exclude = ['alfred/otto', 'alfred/vox', 'governance', 'website', 'tests/.nox']

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I', 'B']

[tool.ruff.lint.per-file-ignores]
# The env vars have to be set before the app imports read them, so these
# imports sit below assignments deliberately.
'tests/conftest.py' = ['E402']

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments -- `db=Depends(get_db)`
# is the documented spelling, and evaluating it once at import is the intended
# behaviour, not the bug B008 describes.
extend-immutable-calls = [
    'fastapi.Depends',
    'fastapi.Query',
    'fastapi.Path',
    'fastapi.Body',
    'fastapi.File',
    'fastapi.Form',
    'fastapi.Header',
    'fastapi.Cookie',
]
