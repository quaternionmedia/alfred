networks:
  alfred_isolated:
  alfred_outgoing:
    driver: bridge
services:
  # TODO Development Reloader description
  website:
    build: ./website/
    image: alfred_site
    volumes:
      - ./website/:/app/
      # Keep the container's node_modules its own. The line above mounts the
      # host's website/ over /app, which otherwise shadows the image's install
      # with the host's -- and native bindings are per-platform, so a Windows
      # or macOS host feeds an Alpine container bindings it cannot load. This
      # anonymous volume masks that one path back out. src/ and dist/ stay
      # shared, which is the point of the mount; the api serves dist/.
      #
      # Anonymous volumes persist across `up`, so after changing a dependency
      # refresh it: `./al init`, or `docker compose up --renew-anon-volumes`.
      - /app/node_modules

  # TODO API description
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: alfred_api
    depends_on:
      - website
      - db
    volumes:
      - ./:/app/
      - ./website/dist/:/app/dist/
      - ./videos/:/app/videos/
      - ./cred_api.json:/cred.json
    networks:
      - alfred_isolated
      - alfred_outgoing
    environment:
      - CELERY_BROKER=mongodb://db:27017/celery
      - CELERY_BACKEND=mongodb://db:27017/celery
      - DB_URL=mongodb://db:27017
      - DB_NAME=alfred
      - GOOGLE_APPLICATION_CREDENTIALS=/cred.json
    env_file:
      - .email
      - .secret_key

  db:
    image: mongo:bionic
    volumes:
      - ./database:/data/db
    networks:
      - alfred_isolated
