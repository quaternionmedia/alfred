networks:
  alfred_isolated:
  alfred_outgoing:
    driver: bridge
# ALFRED_IMAGES: image prefix per checkout (./al sets it).
services:
  # The site's build; dev.yml makes it watch.
  website:
    build: ./website/
    image: ${ALFRED_IMAGES:-alfred}_site
    volumes:
      - ./website/:/app/
      # The image's own install, not the host's. After a dependency change:
      # ./al init. See docs/dev-server.md.
      - /app/node_modules

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_api
    depends_on:
      - website
      - db
    volumes:
      - ./:/app/
      - ./website/dist/:/app/dist/
      - ./videos/:/app/videos/
      - ./cred_api.json:/cred.json
    networks:
      - alfred_isolated
      - alfred_outgoing
    environment:
      - CELERY_BROKER=mongodb://db:27017/celery
      - CELERY_BACKEND=mongodb://db:27017/celery
      - DB_URL=mongodb://db:27017
      - DB_NAME=alfred
      - GOOGLE_APPLICATION_CREDENTIALS=/cred.json
    env_file:
      - .email
      - .secret_key

  db:
    image: mongo:bionic
    volumes:
      # One directory per mongod (./al loop sets ALFRED_DB_DIR).
      - ${ALFRED_DB_DIR:-./database}:/data/db
    networks:
      - alfred_isolated
