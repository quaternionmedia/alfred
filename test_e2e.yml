# The browser suite from a clean checkout, as CI and `./al test` run it:
#   docker compose -f test_e2e.yml up --build --exit-code-from e2e
# Needs nothing beforehand. See docs/build.md#the-browser-suites-stack.

# Shared by the api and the renderer; nothing from the shell. Outputs go to
# the e2e-outputs volume, inputs stay in the checkout's videos/.
x-e2e-settings: &e2e-settings
  CELERY_BROKER: mongodb://db:27017/celery
  CELERY_BACKEND: mongodb://db:27017/celery
  DB_URL: mongodb://db:27017
  DB_NAME: alfred
  VIDEO_DIR: /app/videos
  ALFRED_RENDER_DIR: /outputs/renders
  ALFRED_DELIVERY_DIR: /outputs/deliveries
  ALFRED_PREVIEW_DIR: /outputs/previews
  OTTO_DOWNLOAD_DIR: /outputs/remote-cache
  # The stub below.
  ALFRED_AUDIO_ENGINE_URL: http://audio

volumes:
  # Removed by `./al test`'s `down --volumes` before each run.
  e2e-outputs:

services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      # Healthy: started is not yet answering.
      api:
        condition: service_healthy
      db:
        condition: service_started
      # For the @slow specs' real renders.
      renderer:
        condition: service_started
    volumes:
      - ./website/:/e2e/
      # Hides the host's platform binaries; see docker-compose.yml.
      - /e2e/node_modules
      # For examples.spec.js: ../../docs from e2e/.
      - ./docs/examples/edl/:/docs/examples/edl/:ro
      # The guide's screenshots, which need the stub engine: kept on the host.
      - ./docs/assets/screens/guide/:/docs/assets/screens/guide/
    working_dir: /e2e/
    environment:
      E2E_BASE_URL: http://api
      # The stub, for specs that check what it was sent.
      E2E_AUDIO_ENGINE_URL: http://audio
      # Set per run by ./al loop. E2E_OUTPUT is under website/.
      E2E_PROJECTS: ${E2E_PROJECTS:---project=chromium --project=phone}
      E2E_ARGS: ${E2E_ARGS:-}
      E2E_OUTPUT: ${E2E_OUTPUT:-}
      CI: 'true'
      NODE_PATH: /tmp/deps/node_modules
    # Installed outside the checkout: in place, npm rewrites website/yarn.lock.
    # The runner by path, so it is the version just installed.
    command: >-
      sh -c "mkdir -p /tmp/deps && cp package.json yarn.lock /tmp/deps/ &&
      npm install --prefix /tmp/deps --no-audit --no-fund &&
      /tmp/deps/node_modules/.bin/playwright test $$E2E_PROJECTS $$E2E_ARGS"

  # Builds website/dist, then stays up: --exit-code-from ends the run when any
  # container exits. Healthy on a marker of its own, not on a stale dist/.
  site:
    build: ./website/
    image: ${ALFRED_IMAGES:-alfred}_site
    init: true
    command: sh -c "yarn build && touch /tmp/built && exec tail -f /dev/null"
    volumes:
      - ./website/:/app/
      - /app/node_modules
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/built']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 600s
      start_interval: 2s

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_api
    # No --reload: the run's reports, written under /app, would restart it.
    command:
      ['uvicorn', 'alfred.main:app', '--host', '0.0.0.0', '--port', '80']
    depends_on:
      db:
        condition: service_started
      site:
        condition: service_healthy
      audio:
        condition: service_healthy
    volumes:
      - ./:/app/
      - ./website/dist/:/app/dist/
      # Shared with the renderer.
      - e2e-outputs:/outputs
    environment:
      <<: *e2e-settings
      GOOGLE_APPLICATION_CREDENTIALS: /cred.json
      # This stack's alone, and not a secret.
      ALFRED_SECRET_KEY: e2e-only-signing-key-not-a-secret-never-use-outside-test-e2e
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  # dev.yml's renderer, for the @slow specs' real encodes.
  renderer:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_worker
    entrypoint: celery -A alfred.core.utils.tasks:renderer -b mongodb://db:27017/celery --result-backend mongodb://db:27017/celery worker --loglevel=info
    depends_on:
      - db
      - audio
    volumes:
      - ./:/app/
      - e2e-outputs:/outputs
    environment:
      <<: *e2e-settings

  # A stub of joe's media API, no model (tests/stubs/audio_engine.py). Writes
  # videos/e2e-speech.wav, the one clip with sound the captions specs need.
  audio:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ${ALFRED_IMAGES:-alfred}_audio_stub
    command:
      [
        'python',
        'tests/stubs/audio_engine.py',
        '--host',
        '0.0.0.0',
        '--port',
        '80',
        '--fixture-dir',
        '/app/videos',
      ]
    volumes:
      - ./:/app/
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  db:
    image: mongo:bionic
