services:
  pytest:
    # The Dockerfile's `test` stage: this checkout's api image, plus nox.
    build:
      context: .
      target: test
    image: ${ALFRED_IMAGES:-alfred}_test
    command: -f tests/noxfile.py
    volumes:
      - .:/app
    # For the needs_db tier. Order only: its fixture waits, and fails if the
    # database never answers.
    depends_on:
      - db
    environment:
      - CELERY_BROKER=mongodb://db:27017/celery
      - CELERY_BACKEND=mongodb://db:27017/celery
      - DB_URL=mongodb://db:27017
      - DB_NAME=alfred
      - GOOGLE_APPLICATION_CREDENTIALS=/cred.json

  # Throwaway: no ports, no mounts. Each test worker drops its own database.
  db:
    image: mongo:bionic
