name: 🎎 Haiku detection
on:
  issues:
    types: [opened, reopened, edited]

jobs:
  detect_haiku:
    runs-on: ubuntu-latest
    steps:
      # The checkout major every other workflow of this project's own runs
      # (Node 24). The three copied from governance/qm's project seed --
      # adr-lint, reuse-lint and submodule-check -- keep the seed's versions.
      - name: 🛒 Checkout action repository
        uses: actions/checkout@v7
        with:
          repository: quaternionmedia/haiku
          path: ./.github/actions/haiku
      - name: 👺 Check for haiku
        uses: quaternionmedia/haiku@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
