name: ⚗️ CI tests

on: [push, pull_request]

jobs:
  # As the image installs: 3.11, the three locks and both submodules, all
  # --no-deps. needs_imagemagick skips here. Keep in step with publish.yml.
  # See docs/build.md#ci.
  api_tests:
    name: 🐢 API tests
    uses: quaternionmedia/.github/.github/workflows/pytest.yml@main
    secrets: inherit
    with:
      python_version: '3.11'
      submodules: recursive
      pip_args: '--no-deps -r requirements.lock -r requirements-test.lock -r requirements-render.lock -e . -e alfred/otto -e alfred/vox'

  lint:
    name: 👖 Linter
    uses: quaternionmedia/.github/.github/workflows/lint.yml@main
    with:
      python_version: '3.11'

  format:
    name: 🖤 Black
    uses: quaternionmedia/.github/.github/workflows/black.yml@main
    with:
      python_version: '3.11'

  # The browser suite on test_e2e.yml's stack; project-local, as the stack is.
  integration_tests:
    name: 🔏 Integration tests
    uses: ./.github/workflows/playwright.yml
