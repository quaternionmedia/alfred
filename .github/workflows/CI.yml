name: ⚗️ CI tests

on: [push, pull_request]

jobs:
  api_tests:
    name: 🐢 API tests
    uses: quaternionmedia/.github/.github/workflows/pytest.yml@main
    secrets: inherit

  lint:
    name: 👖 Linter
    uses: quaternionmedia/.github/.github/workflows/lint.yml@main

  format:
    name: 🖤 Black
    uses: quaternionmedia/.github/.github/workflows/black.yml@main

  # The browser suite, against a stack test_e2e.yml builds from the checkout:
  # the site, the api, a render worker and the database. Project-local rather
  # than an org workflow because the stack it builds is this project's own.
  integration_tests:
    name: 🔏 Integration tests
    uses: ./.github/workflows/playwright.yml
