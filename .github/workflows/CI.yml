name: ⚗️ CI tests

on: [push, pull_request]

jobs:
  # The suite as the image runs it: Python 3.11, exactly the versions
  # requirements.lock pins plus the test tools requirements-test.lock pins from
  # the same resolution, and the two engines vendored at alfred/otto (the
  # picture) and alfred/vox (the sound) rather than releases from an index.
  # All with --no-deps, as the Dockerfile and tests/noxfile.py
  # install them: the lock overrides a pin of fastapi-users' that pip cannot,
  # so a resolving install refuses it (the Dockerfile says more). The org
  # workflow's defaults are a floating 3.x -- 3.14, where reportlab<4 has no
  # wheel and nothing installs -- with no submodules and no lockfile.
  # publish.yml runs the same job as its release gate; keep the two in step.
  api_tests:
    name: 🐢 API tests
    uses: quaternionmedia/.github/.github/workflows/pytest.yml@main
    secrets: inherit
    with:
      python_version: '3.11'
      submodules: recursive
      pip_args: '--no-deps -r requirements.lock -r requirements-test.lock -e . -e alfred/otto -e alfred/vox'

  lint:
    name: 👖 Linter
    uses: quaternionmedia/.github/.github/workflows/lint.yml@main
    with:
      python_version: '3.11'

  format:
    name: 🖤 Black
    uses: quaternionmedia/.github/.github/workflows/black.yml@main
    with:
      python_version: '3.11'

  # The browser suite, against a stack test_e2e.yml builds from the checkout:
  # the site, the api, a render worker and the database. Project-local rather
  # than an org workflow because the stack it builds is this project's own.
  integration_tests:
    name: 🔏 Integration tests
    uses: ./.github/workflows/playwright.yml
