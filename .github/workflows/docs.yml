name: docs
on:
  push:
    branches:
      - main
      - dev
      - docs
  # The strict build only; nothing deploys from a pull request.
  pull_request:

jobs:
  # Any warning fails. The deploy waits on this: mike has no --strict.
  build:
    name: 🏗️ Build (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # pyproject's docs ranges. See docs/dependencies.md.
      - name: 🚧 Install dependencies
        run: pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.7,<10'

      - name: 🏗️ Build
        run: mkdocs build --strict

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # mike pushes to gh-pages.
    permissions:
      contents: write
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # As the build's, plus mike.
      - name: 🚧 Install dependencies
        run: pip install 'mkdocs>=1.6,<2' 'mkdocs-material>=9.7,<10' 'mike>=2.1,<3'

      # The identity only: the push uses the checkout's token.
      - name: 🤖 Configure git user
        run: |
          git config --global user.name qm-bot
          git config --global user.email github-action@users.noreply.github.com

      - name: 🧵 Set version string
        run: echo VERSION_TITLE=$(mike list | grep latest) >> $GITHUB_ENV

      - name: 🏗️ Deploy
        run: mike deploy --push --update-aliases ${VERSION_TITLE%\[latest\]} latest
