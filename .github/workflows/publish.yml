name: 🏛 Publish to PyPi

# From a version tag only, which must name the version it publishes
# (governance/qm/records/DRAFT-version-tags-are-claims.md).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: 🏷️ The tag names the version
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      # Exact: `v` + alfred/_version.py, and website/package.json agrees.
      # A manual dispatch must start from the tag too.
      - name: 🏷️ Compare the tag with alfred/_version.py
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import sys

          ref_type, ref_name = os.environ['REF_TYPE'], os.environ['REF_NAME']
          if ref_type != 'tag':
              print(
                  f'::error::Publishing runs from a version tag only; this run '
                  f'is on the {ref_type} {ref_name!r}. Dispatch it from the tag.'
              )
              sys.exit(1)

          source = open('alfred/_version.py', encoding='utf-8').read()
          match = re.search(r'''__version__\s*=\s*['"]([^'"]+)['"]''', source)
          if not match:
              print('::error::alfred/_version.py does not assign __version__')
              sys.exit(1)
          version = match.group(1)

          with open('website/package.json', encoding='utf-8') as f:
              frontend = json.load(f)['version']

          problems = []
          if ref_name != f'v{version}':
              problems.append(
                  f'the tag is {ref_name!r} but alfred/_version.py says '
                  f'{version!r}, so the tag should be v{version}'
              )
          if frontend != version:
              problems.append(
                  f'website/package.json says {frontend!r} where '
                  f'alfred/_version.py says {version!r}'
              )
          for problem in problems:
              print(f'::error::{problem}')
          if problems:
              sys.exit(1)
          print(f'{ref_name} names version {version}')
          EOF

  # CI.yml's api_tests at the tag; keep the two in step. Nothing builds first.
  tests:
    name: 🐢 API tests
    needs: version
    uses: quaternionmedia/.github/.github/workflows/pytest.yml@main
    secrets: inherit
    with:
      python_version: '3.11'
      submodules: recursive
      pip_args: '--no-deps -r requirements.lock -r requirements-test.lock -r requirements-render.lock -e . -e alfred/otto -e alfred/vox'

  build:
    name: 📦 Build package
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      # 3.11, not a floating 3.x. Nothing installed: `pdm build` isolates.
      - name: 📲 Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.11'

      - name: 🏗️ Build package
        run: pdm build

      - name: 🛫 Export build files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: 🗞 Publish package
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # By name, straight into dist/, where the publish action looks.
      - name: 🛬 Download build files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: 🗞 Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
