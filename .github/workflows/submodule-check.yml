name: Submodule refs

# SEED FILE: copy verbatim into a forking project's .github/workflows/.
#
# Verifies every submodule's pinned commit exists on that submodule's own
# remote, so "committed a pointer bump without pushing the submodule" is caught
# here with an actionable message, rather than later as a cryptic
# actions/checkout failure in whichever workflow happens to fetch first:
#
#   fatal: remote error: upload-pack: not our ref <sha>
#
# The seed carries this check so every project has it.
#
# The script runs from the governance submodule, as the ADR lint's does, so the
# job checks out that one submodule and no other: fetching the rest is the
# thing being guarded, and letting it run first would mask this check's
# clearer error.
#
# Triggers on every push and pull request, on any branch: a stale pointer can
# be introduced on any branch, and the breakage surfaces later, at tag time, in
# a different workflow.

on:
  push:
  pull_request:

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch and on a
# project branch the run is the record of what that commit reported, and
# cancelling it would remove the only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QM_SUBMODULE: governance/qm

permissions:
  contents: read

jobs:
  check-submodule-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The governance submodule holds the script, so it is the one submodule
      # this job must check out. Every other one is left alone: an optional or
      # private submodule that the runner has no
      # credentials for would fail the checkout before this job could report
      # anything.
      - name: Check out the governance submodule only
        run: git submodule update --init --depth 1 "$QM_SUBMODULE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify submodule commits are pushed to their own remotes
        run: python "$QM_SUBMODULE/project-seed/ci/check_submodule_pins.py"
