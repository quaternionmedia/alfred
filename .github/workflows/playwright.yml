name: 🎭 Playwright E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 🎭 Playwright
    # Images built cold, then the suite.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7
        with:
          # The images install the engines from their submodules.
          submodules: recursive

      # The stack `./al test` runs: a failure here reproduces with it alone.
      - name: 🧪 Run E2E suite
        run: docker compose -f test_e2e.yml up --build --exit-code-from e2e

      - name: 📊 Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 14

      - name: 🔍 Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: website/test-results/
          retention-days: 14
