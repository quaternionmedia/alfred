name: 🎭 Playwright E2E

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: 🎭 Playwright
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🚧 Init project
        run: ./al init

      - name: 🏗️ Build site
        run: >-
          docker compose -f docker-compose.yml run website
          yarn parcel build /app/src/index.html /app/src/*.svg /app/src/*.png

      - name: 🧪 Run E2E suite
        run: docker compose -f test_e2e.yml up --exit-code-from e2e

      - name: 📊 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 14

      - name: 🔍 Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: website/test-results/
          retention-days: 14
