name: 📜 License report

# Report-only: never fails a build. Python, npm and the image, the three
# runtime paths. What would make it a gate: docs/build.md#license-report.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: 🐍 Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 📲 Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.11'

      - name: 🚚 Install production dependencies
        run: pdm install --prod --no-editable

      - name: 📜 Report
        run: |
          mkdir -p license-reports
          pdm list --fields name,version,licenses --csv \
            > license-reports/python-licenses.csv
          {
            echo '## Python dependency licenses'
            echo
            echo "Packages: $(( $(wc -l < license-reports/python-licenses.csv) - 1 ))"
            echo
            echo '### Distinct declared license strings'
            echo
            echo '```'
            tail -n +2 license-reports/python-licenses.csv \
              | sed 's/^[^,]*,[^,]*,//' | tr -d '"' | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛫 Upload report
        uses: actions/upload-artifact@v7
        with:
          name: python-licenses
          path: license-reports/

  npm:
    name: 📦 Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7

      # website/Dockerfile's major.
      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 🚚 Install dependencies
        working-directory: website
        run: npm install --omit=dev --no-audit --no-fund

      - name: 📜 Report
        working-directory: website
        run: |
          mkdir -p ../license-reports
          npx --yes license-checker --production --csv \
            > ../license-reports/npm-licenses.csv
          {
            echo '## Frontend dependency licenses'
            echo
            echo '`license-checker` is used rather than a direct read of the'
            echo '`license` field, because it also resolves the deprecated'
            echo '`licenses` array that at least one direct dependency here'
            echo 'still uses.'
            echo
            echo '### Distinct declared license strings'
            echo
            echo '```'
            tail -n +2 ../license-reports/npm-licenses.csv \
              | awk -F'","' '{print $2}' | tr -d '"' | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛫 Upload report
        uses: actions/upload-artifact@v7
        with:
          name: npm-licenses
          path: license-reports/

  image:
    name: 🐳 Image SBOM
    runs-on: ubuntu-latest
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🔨 Build image
        id: build
        continue-on-error: true
        run: docker build -t alfred-sbom-target:ci .

      - name: 📜 Generate SBOM
        if: steps.build.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: alfred-sbom-target:ci
          artifact-name: image-sbom.spdx.json
          output-file: image-sbom.spdx.json

      - name: 📝 Summary
        run: |
          {
            echo '## Image SBOM'
            echo
            if [ '${{ steps.build.outcome }}' = 'success' ]; then
              echo 'Image built; SBOM generated and uploaded as an artifact.'
            else
              echo 'Image build did not succeed, so no SBOM was produced for'
              echo 'it. This step is report-only and does not fail the run.'
            fi
            echo
            echo 'An SBOM of the application image does not cover the other'
            echo 'images the deployed stack runs, nor any hosted service it'
            echo 'depends on. Those are tracked in `governance/qm/adr/`, not'
            echo 'here, because no scanner can discover them from this repo.'
          } >> "$GITHUB_STEP_SUMMARY"
